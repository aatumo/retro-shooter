<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            color: #eee;
        }
        .container { text-align: center; }
        h1 { margin-bottom: 20px; font-size: 2rem; }
        .status {
            margin-bottom: 20px;
            font-size: 1.3rem;
            min-height: 2em;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 6px;
            margin: 0 auto 30px;
            width: fit-content;
        }
        .cell {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover { background: #1a1a4e; transform: scale(1.03); }
        .cell.x { color: #e94560; }
        .cell.o { color: #0fbcf9; }
        .cell.win { background: #0f3460; animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { to { transform: scale(1.05); } }
        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            background: #e94560;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #c0392b; }
        .score {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .score span { font-weight: bold; }
        .score .x-score { color: #e94560; }
        .score .o-score { color: #0fbcf9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="score">
            <div>X: <span class="x-score">0</span></div>
            <div>Draws: <span class="d-score">0</span></div>
            <div>O: <span class="o-score">0</span></div>
        </div>
        <div class="status">X's turn</div>
        <div class="board"></div>
        <button onclick="resetGame()">New Game</button>
    </div>
    <script>
        let board = Array(9).fill('');
        let current = 'X';
        let gameOver = false;
        let scores = { X: 0, O: 0, D: 0 };

        const wins = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        const boardEl = document.querySelector('.board');
        const statusEl = document.querySelector('.status');

        function render() {
            boardEl.innerHTML = '';
            board.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
                cell.textContent = val;
                cell.addEventListener('click', () => play(i));
                boardEl.appendChild(cell);
            });
            document.querySelector('.x-score').textContent = scores.X;
            document.querySelector('.o-score').textContent = scores.O;
            document.querySelector('.d-score').textContent = scores.D;
        }

        function play(i) {
            if (board[i] || gameOver) return;
            board[i] = current;
            const winner = checkWin();
            if (winner) {
                gameOver = true;
                scores[current]++;
                statusEl.textContent = current + ' wins!';
                highlightWin(winner);
            } else if (board.every(c => c)) {
                gameOver = true;
                scores.D++;
                statusEl.textContent = "It's a draw!";
            } else {
                current = current === 'X' ? 'O' : 'X';
                statusEl.textContent = current + "'s turn";
            }
            render();
        }

        function checkWin() {
            for (const combo of wins) {
                if (combo.every(i => board[i] === current)) return combo;
            }
            return null;
        }

        function highlightWin(combo) {
            setTimeout(() => {
                combo.forEach(i => {
                    boardEl.children[i].classList.add('win');
                });
            }, 10);
        }

        function resetGame() {
            board = Array(9).fill('');
            current = 'X';
            gameOver = false;
            statusEl.textContent = "X's turn";
            render();
        }

        render();
    </script>
</body>
</html>
